name: build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid semver version (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const version = process.argv[2];

          const patch = (file, transform) => {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) {
              console.log(`${file}: already ${version}`);
              return;
            }
            fs.writeFileSync(file, after);
            console.log(`${file}: -> ${version}`);
          };

          const patchJson = (file, mutate) => patch(file, (text) => {
            const json = JSON.parse(text);
            mutate(json);
            return JSON.stringify(json, null, 2) + '\n';
          });

          patchJson('package.json', (json) => { json.version = version; });
          patchJson('package-lock.json', (json) => {
            json.version = version;
            if (json.packages && json.packages['']) json.packages[''].version = version;
          });
          patchJson('src-tauri/tauri.conf.json', (json) => { json.version = version; });
          patch('src-tauri/Cargo.toml', (text) =>
            text.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`));
          patch('src-tauri/Cargo.lock', (text) =>
            text.replace(/(name = "game-space"\nversion = )"[^"]*"/, `$1"${version}"`));
          EOF
          echo "Building Game Space ${VERSION}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build bundles
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            printf '## Changelog\n\n'
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
            git log --pretty=format:'- %s (%h)' "$RANGE" \
              | grep -iE '^- (fix|update|add|remove):' \
              | sed -E -e 's/^- fix:/🐛/I' -e 's/^- update:/🔄/I' \
                       -e 's/^- add:/✨/I' -e 's/^- remove:/🗑️/I' \
              || printf '%s\n' "_No matching commits._"
            printf '\n'
          } > release-notes.md

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' FILES < <(find bundles -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' \) -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No bundle files found" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          ARGS=(--verify-tag --title "$TAG" --notes-file release-notes.md)
          if [[ "$TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}" "${FILES[@]}"
